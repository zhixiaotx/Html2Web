name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required to push to gh-pages and deploy to Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码 (Checkout repository)
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装项目依赖 (Install dependencies)
        run: npm ci || npm install

      - name: 相对路径静态打包 (Build with relative paths)
        run: npx vite build

      - name: 复制 404 兜底文件 (SPA Fallback for GitHub Pages)
        run: cp dist/index.html dist/404.html

      - name: 推送至 gh-pages 分支并发布 (Push to gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: deploy application to gh-pages [skip ci]"
